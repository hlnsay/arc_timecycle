<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timecycle Menu</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="timecycleMenu" class="menu">
        <div id="title">Название Timecycle</div>
        <input type="text" id="timecycleInput" placeholder="Введите таймцикл">
        <div id="ButtonContainer">
            <button class="enterButton" onclick="applyTimecycle()">Принять</button>
            <button class="clearButton" onclick="clearTimecycle()">Сбросить</button>
            <button class="closeButton" onclick="closeMenu()">X</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
